<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skor Langsung — Sepak Bola</title>
<style>
  :root {
    --bg: #0d1411; --panel: #14201a; --panel-2: #1a2a22; --line: #24382e;
    --ink: #eaf2ec; --muted: #7f9c8b; --live: #3ddc84; --live-dim: #1c4a30;
    --amber: #f5c542; --accent: #3ddc84;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font);
    line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { margin-bottom: 20px; }
  .title { font-size: clamp(28px, 6vw, 40px); font-weight: 800; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 12px; }
  .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--live);
    box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: pulse 2s infinite; flex: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(61,220,132,.5); }
    70% { box-shadow: 0 0 0 10px rgba(61,220,132,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 20px 0 18px; }
  select { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: var(--font); outline: none; }
  select:focus { border-color: var(--accent); }
  button { background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: var(--font); }
  button:hover { border-color: var(--accent); color: var(--ink); }
  .refresh-note { color: var(--muted); font-size: 12px; margin-left: auto; }
  .comp { margin-bottom: 22px; }
  .comp-head { display: flex; align-items: center; gap: 10px; padding: 6px 2px 10px;
    font-size: 13px; font-weight: 700; color: var(--muted);
    border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .comp-head img { width: 20px; height: 20px; object-fit: contain; }
  .match { display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: center;
    padding: 12px 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 8px; }
  .match.is-live { border-color: var(--live-dim); background: var(--panel-2); }
  .status { font-size: 11px; font-family: var(--mono); text-align: center; color: var(--muted); font-weight: 600; }
  .status .min { color: var(--live); font-size: 15px; }
  .status .live-tag { display: inline-block; background: var(--live-dim); color: var(--live);
    padding: 2px 6px; border-radius: 5px; font-size: 10px; margin-top: 3px; }
  .teams { min-width: 0; }
  .team { display: flex; align-items: center; gap: 9px; font-size: 15px; padding: 2px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team img { width: 20px; height: 20px; object-fit: contain; flex: none; }
  .team.win { font-weight: 700; }
  .score { font-family: var(--mono); font-size: 20px; font-weight: 700; text-align: right; min-width: 42px; }
  .score .live { color: var(--live); }
  .score.pending { color: var(--muted); font-size: 13px; font-weight: 500; }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 15px; }
  .msg.err { color: var(--amber); }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; margin: 30px auto; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 480px) {
    .match { grid-template-columns: 54px 1fr auto; gap: 8px; padding: 10px; }
    .team { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><span class="pulse"></span>Skor Langsung</div>
    <div class="sub">Pertandingan sepak bola hari ini — via Vercel + football-data.org</div>
  </header>
  <div class="controls">
    <select id="filter">
      <option value="all">Semua status</option>
      <option value="live">Sedang berlangsung</option>
      <option value="upcoming">Akan datang</option>
      <option value="finished">Selesai</option>
    </select>
    <select id="scope">
      <option value="today">Hari ini</option>
      <option value="live">Live saja</option>
    </select>
    <button id="reload">Muat ulang</button>
    <span class="refresh-note" id="note">Auto-refresh 60 dtk saat ada laga live</span>
  </div>
  <div id="content"><div class="spinner"></div></div>
</div>
<script>
// Proxy serverless Vercel — path relatif, satu domain dengan halaman ini.
const PROXY = "/api/matches";

const $ = s => document.querySelector(s);
const content = $("#content");
let timer = null;
let lastData = [];

const COMP_ORDER = ["CL","PL","PD","SA","BL1","FL1","DED","PPL","ELC","BSA","EC","WC"];
const COMP_NAME = {
  CL:"UEFA Champions League", PL:"Premier League", PD:"La Liga",
  SA:"Serie A", BL1:"Bundesliga", FL1:"Ligue 1", DED:"Eredivisie",
  PPL:"Primeira Liga", ELC:"Championship", BSA:"Brasileirão Série A",
  EC:"European Championship", WC:"World Cup"
};
const LIVE = new Set(["IN_PLAY","PAUSED","LIVE"]);
const DONE = new Set(["FINISHED","AWARDED"]);

$("#reload").onclick = fetchMatches;
$("#filter").onchange = render;
$("#scope").onchange = fetchMatches;

async function fetchMatches(){
  content.innerHTML = '<div class="spinner"></div>';
  const scope = $("#scope").value;
  try {
    const res = await fetch(PROXY + "?scope=" + scope);
    if(res.status === 429){ msg("Kena batas rate (429). Tunggu sebentar lalu muat ulang.", true); return; }
    if(res.status === 403){ msg("Token ditolak (403). Periksa FD_TOKEN di Vercel atau kuota tier gratis.", true); stopTimer(); return; }
    if(!res.ok){
      let d=""; try{ d=(await res.json()).error||""; }catch(e){}
      msg("Gagal memuat (HTTP " + res.status + "). " + d, true); return;
    }
    const data = await res.json();
    if(data.error){ msg(data.error, true); return; }
    lastData = data.matches || [];
    render();
    scheduleAuto();
  } catch(e){
    msg("Gagal terhubung ke proxy /api/matches.", true);
  }
}

function render(){
  const filter = $("#filter").value;
  let matches = lastData.slice();
  if(filter === "live") matches = matches.filter(m => LIVE.has(m.status));
  else if(filter === "upcoming") matches = matches.filter(m => m.status === "TIMED" || m.status === "SCHEDULED");
  else if(filter === "finished") matches = matches.filter(m => DONE.has(m.status));

  if(!matches.length){
    content.innerHTML = '<div class="empty">Tidak ada pertandingan untuk filter ini.</div>';
    return;
  }
  const groups = {};
  for(const m of matches){
    const code = (m.competition && m.competition.code) || "??";
    (groups[code] = groups[code] || []).push(m);
  }
  const codes = Object.keys(groups).sort((a,b)=>{
    const ia = COMP_ORDER.indexOf(a), ib = COMP_ORDER.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  let html = "";
  for(const code of codes){
    const g = groups[code];
    const comp = g[0].competition;
    html += '<div class="comp"><div class="comp-head">' + (comp.emblem?'<img src="'+comp.emblem+'" alt="">':"") + escapeHtml(COMP_NAME[code]||comp.name||code) + '</div>';
    g.sort((a,b)=> new Date(a.utcDate) - new Date(b.utcDate));
    for(const m of g) html += matchRow(m);
    html += '</div>';
  }
  content.innerHTML = html;
}

function matchRow(m){
  const live = LIVE.has(m.status);
  const done = DONE.has(m.status);
  const h = m.homeTeam, a = m.awayTeam;
  const hs = m.score && m.score.fullTime ? m.score.fullTime.home : null;
  const as = m.score && m.score.fullTime ? m.score.fullTime.away : null;
  const hasScore = hs !== null && hs !== undefined;
  let statusHtml;
  if(live){
    const min = m.minute ? (m.minute + "'") : (m.status==="PAUSED" ? "HT" : "LIVE");
    statusHtml = '<div class="status"><span class="min">' + escapeHtml(String(min)) + '</span><br><span class="live-tag">LIVE</span></div>';
  } else if(done){
    statusHtml = '<div class="status">FT</div>';
  } else {
    const t = new Date(m.utcDate).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    statusHtml = '<div class="status">' + t + '</div>';
  }
  const hWin = hasScore && hs > as, aWin = hasScore && as > hs;
  const scoreHtml = hasScore
    ? '<div class="score">' + (live?'<span class="live">':'') + hs + '–' + as + (live?'</span>':'') + '</div>'
    : '<div class="score pending">vs</div>';
  return '<div class="match ' + (live?'is-live':'') + '">' + statusHtml +
    '<div class="teams">' +
      '<div class="team ' + (hWin?'win':'') + '">' + (h.crest?'<img src="'+h.crest+'" alt="">':"") + escapeHtml(h.shortName||h.name) + '</div>' +
      '<div class="team ' + (aWin?'win':'') + '">' + (a.crest?'<img src="'+a.crest+'" alt="">':"") + escapeHtml(a.shortName||a.name) + '</div>' +
    '</div>' + scoreHtml + '</div>';
}

function scheduleAuto(){
  stopTimer();
  if(lastData.some(m => LIVE.has(m.status))) timer = setTimeout(fetchMatches, 60000);
}
function stopTimer(){ if(timer){ clearTimeout(timer); timer = null; } }
function msg(text, err){ content.innerHTML = '<div class="msg ' + (err?'err':'') + '">' + escapeHtml(text) + '</div>'; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

fetchMatches();
</script>
</body>
</html>
